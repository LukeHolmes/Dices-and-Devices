name: Tablet Matchbook checks
on:
  workflow_dispatch:
  push:
    branches: [fix/tablet-matchbook-readability]
jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node --test --test-name-pattern='@ 768x1024$' tests/polish-step5-layout.test.cjs
