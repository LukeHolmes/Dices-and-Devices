            if (resolved[i].faceId === 'ECHO_FACE' && i > 0) resolved[i] = { ...resolved[i-1], faceLabel: 'ECHOED', isEchoed: true };
        }
        const destroyed = new Set();
        resolved.forEach((d, i) => {
            if (d.faceId === 'SHIV_FACE' || (d.isEchoed && d.faceId === 'SHIV_FACE')) {
                if (i < 4) destroyed.add(i + 1);
            }
        });
        return { resolved, destroyed };
    };

    const emptySynergyResult = () => ({ synergyEvents: [], chainDepth: 0, retriggerCount: 0 });

    const isBloodOrDestructive = (d) => {
        if (!d) return false;
        return d.type === 'blood' || d.type === 'destructive' || d.faceId === 'BLOOD_6' || d.faceId === 'SHIV_FACE';
    };

    const neighborIndices = (i) => [i - 1, i + 1].filter(j => j >= 0 && j <= 4);

    const applyFaceModifiersForDie = (d, state, { pushStep, triggers, slotLabel = '' }) => {
        const face = d.faceId;
        const prefix = slotLabel ? `SLOT ${slotLabel}: ` : '';
        if (face === 'MULT_FACE') { state.mult += 1; triggers.push({ name: '+MULT', value: '+1x' }); pushStep('multiplier', `${prefix}FACE: +MULT`, '+1x multiplier', '+1x'); }
        if (face === 'GOLD_FACE') { state.gDelta += 2; triggers.push({ name: 'CASH', value: '+$2' }); pushStep('modifier', `${prefix}FACE: GOLD`, '+$2 cash', '+$2'); }
        if (face === 'BLOOD_6') { state.chips += 20; state.gDelta -= 1; triggers.push({ name: 'BLOOD', value: '+20/-$1' }); pushStep('modifier', `${prefix}FACE: BLOOD 6`, '+20 chips, -$1', '+20 / -$1'); }
        if (face === 'SHIV_FACE') { state.chips += 40; triggers.push({ name: 'SHIV', value: '+40' }); pushStep('modifier', `${prefix}FACE: SHIV`, '+40 chips', 40); }
        if (face === 'WIREBAG_FACE') { state.mult -= 1; state.gDelta += 4; triggers.push({ name: 'WIRE', value: '-1x/+$4' }); pushStep('penalty', `${prefix}FACE: WIREBAG`, '-1x, +$4', '-1x / +$4'); }
        if (face === 'GHOST_FACE') { state.mult += 2; triggers.push({ name: 'GHOST', value: '+2x' }); pushStep('multiplier', `${prefix}FACE: GHOST`, '+2x multiplier', '+2x'); }
    };

    const applyAllFaceModifiers = (resolved, destroyed, state, api) => {
        resolved.forEach((d, i) => {
            if (destroyed.has(i)) return;
            applyFaceModifiersForDie(d, state, api);
        });
    };

    const pushSynergyEvent = (state, { chainId, kind, label, impact }) => {
        const chainIndex = state.synergyPass;
        state.synergyEvents.push({ id: chainId, kind, source: { chainId }, label, impact, chainIndex });
        state.triggers.push({ name: chainId.replace(/_/g, ' '), value: String(impact) });
        state.pushStep('modifier', `CHAIN: ${label}`, impact, impact);
        if (kind === 'retrigger') state.retriggerCount += 1;
    };

    const resolveSynergyFaceChains = (resolved, destroyed, state, tuning) => {
        const applied = state.synergyApplied;
        if (!applied.has('blood_ripple')) {
            let rippleMult = 0;
            resolved.forEach((d, i) => {
                if (destroyed.has(i) || d.faceId !== 'BLOOD_6') return;
                neighborIndices(i).forEach(j => {
                    if (destroyed.has(j)) return;
                    if (isBloodOrDestructive(resolved[j])) rippleMult += 1;
                });
            });
            rippleMult = Math.min(3, rippleMult);
            if (rippleMult > 0) {
                state.mult += rippleMult;
                pushSynergyEvent(state, { chainId: 'blood_ripple', kind: 'mult', label: 'Blood ripple', impact: `+${rippleMult}x` });
                applied.add('blood_ripple');
            }
        }
        if (!applied.has('ghost_echo')) {
            let ghostEcho = false;
            for (let i = 0; i < 5; i++) {
                if (destroyed.has(i)) continue;
                const d = resolved[i];
                if (d.faceId !== 'GHOST_FACE') continue;
                const hasEchoNeighbor = neighborIndices(i).some(j => !destroyed.has(j) && (resolved[j].faceId === 'ECHO_FACE' || resolved[j].isEchoed));
                if (hasEchoNeighbor) { ghostEcho = true; break; }
            }
            if (ghostEcho) {
                state.mult += 1;
                pushSynergyEvent(state, { chainId: 'ghost_echo', kind: 'mult', label: 'Ghost echo', impact: '+1x' });
                applied.add('ghost_echo');
            }
        }
        if (!applied.has('wire_feed')) {
            let fed = false;
            for (let i = 0; i < 5; i++) {
                if (destroyed.has(i)) continue;
                const d = resolved[i];
                if (d.faceId !== 'WIREBAG_FACE') continue;
                const hasGoldNeighbor = neighborIndices(i).some(j => !destroyed.has(j) && resolved[j].faceId === 'GOLD_FACE');
                if (hasGoldNeighbor) { fed = true; break; }
            }
            if (fed) {
                state.gDelta += 2;
                pushSynergyEvent(state, { chainId: 'wire_feed', kind: 'cash', label: 'Wire feed (extra gold)', impact: '+$2' });
                applied.add('wire_feed');
            }
        }
        void tuning;
    };

    const resolveSynergyHardwareChains = (resolved, destroyed, state, hwMeta) => {
        const applied = state.synergyApplied;
        if (!applied.has('engine_link') && hwMeta.engineBonus >= 2) {
            const modCount = resolved.filter((d, i) => !destroyed.has(i) && d.type === 'modifier').length;
            const linkMult = Math.min(4, modCount);
            if (linkMult > 0) {
                state.mult += linkMult;
                pushSynergyEvent(state, { chainId: 'engine_link', kind: 'mult', label: 'Engine link', impact: `+${linkMult}x` });
                applied.add('engine_link');
            }
        }
        if (!applied.has('bookends_retrigger') && hwMeta.bookendsMatched) {
            const api = { pushStep: state.pushStep, triggers: state.triggers };
            [0, 4].forEach(i => {
                if (!destroyed.has(i)) applyFaceModifiersForDie(resolved[i], state, { ...api, slotLabel: String(i + 1) });
            });
            pushSynergyEvent(state, { chainId: 'bookends_retrigger', kind: 'retrigger', label: 'Bookends retrigger', impact: 'faces 1 & 5' });
            applied.add('bookends_retrigger');
        }
        if (!applied.has('crowbar_cascade') && hwMeta.crowbarMultAdded > 0) {
            let cascadeChips = 0;
            destroyed.forEach(i => {
                if (isBloodOrDestructive(resolved[i])) cascadeChips += 5;
            });
            cascadeChips = Math.min(25, cascadeChips);
            if (cascadeChips > 0) {
                state.chips += cascadeChips;
                pushSynergyEvent(state, { chainId: 'crowbar_cascade', kind: 'chips', label: 'Crowbar cascade', impact: `+${cascadeChips}` });
                applied.add('crowbar_cascade');
            }
        }
    };

    const runSynergyPasses = (resolved, destroyed, state, tuning, hwMeta) => {
        const maxPasses = Math.max(1, tuning.maxChainPasses || 8);
        for (state.synergyPass = 0; state.synergyPass < maxPasses; state.synergyPass += 1) {
            const before = state.synergyEvents.length;
            resolveSynergyFaceChains(resolved, destroyed, state, tuning);
            if (hwMeta) resolveSynergyHardwareChains(resolved, destroyed, state, hwMeta);
            if (state.synergyEvents.length === before) break;
        }
        const chainDepth = state.synergyEvents.length
            ? Math.max(...state.synergyEvents.map(e => e.chainIndex)) + 1
            : 0;
        return { chainDepth, retriggerCount: state.retriggerCount, synergyEvents: state.synergyEvents };
    };

    const applyHardware = (resolved, destroyed, catId, standardVals, inventory, hardwareDisabled, activeBoss, state) => {
        const meta = { engineBonus: 0, crowbarMultAdded: 0, bookendsMatched: false };
        if (hardwareDisabled) {
            if (inventory.length > 0) {
                state.pushStep('penalty', `BOSS: ${activeBoss?.name || 'CROOKED COP'}`, 'Hardware triggers disabled this hand', 'NO HARDWARE');
            }
            return meta;
        }
        const { pushStep, triggers } = state;
        inventory.forEach(item => {
            if (item.id === 'CENTERPIECE') {
                const center = resolved[2];
                if (center && !destroyed.has(2)) {
                    let centerChips = 0;
                    let centerMult = 0;
                    if (typeof center.value === 'number') {
                        state.chips += center.value;
                        centerChips += center.value;
                    }
                    if (center.faceId === 'MULT_FACE') { state.mult += 1; centerMult += 1; }
                    if (center.faceId === 'GHOST_FACE') { state.mult += 2; centerMult += 2; }
                    if (center.faceId === 'GOLD_FACE') { state.gDelta += 2; triggers.push({ name: 'CENTER', value: '+$2' }); }
                    triggers.push({ name: 'CENTER', value: 'slot 3' });
                    state.hardwareTriggerCount += 1;
                    pushStep('modifier', 'HARDWARE: CENTERPIECE', `Slot 3 copy${centerChips ? ` +${centerChips} chips` : ''}${centerMult ? ` +${centerMult}x` : ''}`, `${centerChips ? `+${centerChips}` : ''}${centerMult ? `${centerChips ? ' / ' : ''}+${centerMult}x` : ''}` || 'TRIGGERED');
                }
            }
            if (item.id === 'BOOKENDS' && resolved[0].value === resolved[4].value && resolved[0].faceId === resolved[4].faceId && !destroyed.has(0) && !destroyed.has(4)) {
                state.chips += 30;
                triggers.push({ name: 'BOOKENDS', value: '+30' });
                state.hardwareTriggerCount += 1;
                meta.bookendsMatched = true;
                pushStep('modifier', 'HARDWARE: BOOKENDS', '+30 chips', 30);
            }
            if (item.id === 'ENGINE') {
                const anchor = resolved[0].value;
                if (typeof anchor === 'number' && !destroyed.has(0)) {
                    const bonus = Math.min(4, resolved.slice(1).filter((d, idx) => !destroyed.has(idx + 1) && typeof d.value === 'number' && d.value > anchor).length);
                    if (bonus) {
                        state.mult += bonus;
                        meta.engineBonus = bonus;
                        triggers.push({ name: 'ENGINE', value: `+${bonus}x` });
                        state.hardwareTriggerCount += 1;
                        pushStep('multiplier', 'HARDWARE: ENGINE', `+${bonus}x multiplier`, `+${bonus}x`);
                    }
                }
            }
            if (item.id === 'LOADED_DIE' && catId === 'TOK') {
                state.chips += 10;
                triggers.push({ name: 'LOADED', value: '+10' });
                state.hardwareTriggerCount += 1;
                pushStep('modifier', 'HARDWARE: WEIGHTED CORE', '+10 chips on Triad', 10);
            }
            if (item.id === 'BLOOD_PACT') {
                state.mult *= 3;
                triggers.push({ name: 'PACT', value: 'x3' });
                state.hardwareTriggerCount += 1;
                pushStep('multiplier', 'HARDWARE: BLOOD PACT', 'Tripled multiplier', 'x3');
            }
            if (item.id === 'BRASS_KNUCKLES' && standardVals.length > 0 && standardVals.every(v => v <= 3)) {
                state.mult += 3;
                triggers.push({ name: 'KNUCKLES', value: '+3x' });
                state.hardwareTriggerCount += 1;
                pushStep('multiplier', 'HARDWARE: BRASS KNUCKLES', '+3x on low faces', '+3x');
            }
            if (item.id === 'CROWBAR') {
                const count = Math.min(5, resolved.filter((d,i) => !destroyed.has(i) && isBloodOrDestructive(d)).length);
                if (count) {
                    state.mult += count;
                    meta.crowbarMultAdded = count;
                    triggers.push({ name: 'CROWBAR', value: `+${count}x` });
                    state.hardwareTriggerCount += 1;
                    pushStep('multiplier', 'HARDWARE: CROWBAR', `+${count}x from blood/destructive faces`, `+${count}x`);
                }
            }
        });
        return meta;
    };

    const calculateScore = (catId, currentDice, context) => {
        const { handLevels, flowStreak, inventory, hardwareDisabled, activeBoss,
            CATEGORIES, HAND_MASTERY_TUNING, getFlowMultiplier, getHandMasteryBonus,
            synergyTuning = { enabled: false } } = context;
        const synergyEnabled = Boolean(synergyTuning?.enabled);
        const { resolved, destroyed } = resolveDice(currentDice);
        const standardVals = resolved.filter((d, i) => !destroyed.has(i) && typeof d.value === 'number' && d.value > 0 && d.faceId !== 'GHOST_FACE').map(d => d.value);
        const wilds = resolved.filter((d, i) => !destroyed.has(i) && d.value === 'W').length;
        const sum = standardVals.reduce((a,b)=>a+b,0) + wilds * 6;
        const counts = {};
        standardVals.forEach(x => counts[x] = (counts[x] || 0) + 1);
        const cArr = Object.values(counts);
        const maxCount = cArr.length ? Math.max(...cArr) : 0;
        const handLevel = handLevels[catId] || HAND_MASTERY_TUNING.baseLevel;
        const flowMult = getFlowMultiplier(flowStreak);
        let chips = 0, mult = 1, valid = false, gDelta = 0, triggers = [];
        const explanationSteps = [];
        let hardwareTriggerCount = 0;
        const categoryName = CATEGORIES[catId]?.name || catId;
        const pushStep = (type, label, value, impact) => {
            explanationSteps.push({ type, label, value, impact });
        };
        switch(catId) {
            case 'ONES': valid = true; chips = ((counts[1] || 0) + wilds) * 1; break;
            case 'TWOS': valid = true; chips = ((counts[2] || 0) + wilds) * 2; break;
            case 'THREES': valid = true; chips = ((counts[3] || 0) + wilds) * 3; break;
            case 'FOURS': valid = true; chips = ((counts[4] || 0) + wilds) * 4; break;
            case 'FIVES': valid = true; chips = ((counts[5] || 0) + wilds) * 5; break;
            case 'SIXES': valid = true; chips = ((counts[6] || 0) + wilds) * 6; break;
            case 'TOK': valid = maxCount + wilds >= 3; if (valid) { chips = 20; mult *= 2; } break;
            case 'FOK': valid = maxCount + wilds >= 4; if (valid) { chips = 35; mult *= 3; } break;
            case 'FH': {
                const scoringBones = resolved.filter((d, i) => !destroyed.has(i) && (d.value === 'W' || (typeof d.value === 'number' && d.value > 0))).length;
                valid = scoringBones >= 5 && ((cArr.includes(3) && cArr.includes(2)) || (wilds >= 1 && cArr.length <= 2 && maxCount >= 2));
                if (valid) { chips = 30; mult *= 3; }
                break;
            }
            case 'SS': {
                const has = req => req.filter(v => !standardVals.includes(v)).length <= wilds;
                valid = has([1,2,3,4]) || has([2,3,4,5]) || has([3,4,5,6]);
                if (valid) { chips = 30; mult *= 2; }
                break;
            }
            case 'LS': {
                const has = req => req.filter(v => !standardVals.includes(v)).length <= wilds;
                valid = has([1,2,3,4,5]) || has([2,3,4,5,6]);
                if (valid) { chips = 40; mult *= 3; }
                break;
            }
            case 'Y': valid = maxCount + wilds >= 5; if (valid) { chips = 50; mult *= 5; } break;
            case 'C': valid = true; chips = sum; break;
        }
        if (!valid) {
            const invalidReason = (() => {
                switch (catId) {
                    case 'TOK': return 'Triad needs three of a kind.';
                    case 'FOK': return 'Quad needs four of a kind.';
                    case 'FH': return 'Full Ride needs three of a kind plus a pair.';
                    case 'SS': return 'Short Run needs four dice in a straight.';
                    case 'LS': return 'Long Run needs five dice in a straight.';
                    case 'Y': return 'Jackpot needs five of a kind.';
                    default: return `${categoryName} did not match this hand.`;
                }
            })();
            pushStep('system', 'INVALID PAYOUT', invalidReason, 0);
            return { valid: false, chips: 0, mult: 0, total: 0, gDelta: 0, triggers: [], flowMult, explanationSteps, hardwareTriggerCount, categoryName, reason: invalidReason, ...emptySynergyResult() };
        }
        pushStep('base', `${categoryName.toUpperCase()} BASE`, `${chips} chips`, chips);
        pushStep('multiplier', 'CATEGORY MULT', `x${mult.toFixed(2)}`, `x${mult.toFixed(2)}`);
        const masteryBonus = getHandMasteryBonus(handLevel);
        if (masteryBonus > 0) {
            chips += masteryBonus;
            triggers.push({ name: 'MASTERY', value: `+${masteryBonus}` });
            pushStep('modifier', 'HAND MASTERY', `+${masteryBonus} chips`, masteryBonus);
        }
        const scoreState = {
            chips, mult, gDelta, triggers, pushStep, hardwareTriggerCount,
            synergyEvents: [], synergyApplied: new Set(), retriggerCount: 0, synergyPass: 0
        };
        const faceApi = { pushStep, triggers };
        applyAllFaceModifiers(resolved, destroyed, scoreState, faceApi);
        chips = scoreState.chips;
        mult = scoreState.mult;
        gDelta = scoreState.gDelta;

        let synergyResult = emptySynergyResult();
        if (synergyEnabled) {
            runSynergyPasses(resolved, destroyed, scoreState, synergyTuning, null);
        }
        chips = scoreState.chips;
        mult = scoreState.mult;
        gDelta = scoreState.gDelta;

        const unclampedMult = scoreState.mult;
        scoreState.mult = Math.max(0.5, scoreState.mult);
        if (scoreState.mult !== unclampedMult) pushStep('system', 'MULTIPLIER FLOOR', 'Multiplier cannot drop below x0.50', `x${scoreState.mult.toFixed(2)}`);

        const hwMeta = applyHardware(resolved, destroyed, catId, standardVals, inventory, hardwareDisabled, activeBoss, scoreState);
        chips = scoreState.chips;
        mult = scoreState.mult;
        gDelta = scoreState.gDelta;
        hardwareTriggerCount = scoreState.hardwareTriggerCount;

        if (synergyEnabled) {
            const postHw = runSynergyPasses(resolved, destroyed, scoreState, synergyTuning, hwMeta);
            chips = scoreState.chips;
            mult = scoreState.mult;
            gDelta = scoreState.gDelta;
            synergyResult = postHw;
        }

        if (flowMult > 1) triggers.push({ name: 'FLOW', value: `x${flowMult.toFixed(2)}` });
        pushStep('multiplier', 'FLOW STREAK', `x${flowMult.toFixed(2)} flow multiplier`, `x${flowMult.toFixed(2)}`);
        const total = Math.floor(chips * mult * flowMult);
        pushStep('system', 'FINAL FORMULA', `${chips} x ${mult.toFixed(2)} x ${flowMult.toFixed(2)}`, total);
        return {
            valid: true, chips, mult, total, flowMult, gDelta, triggers, explanationSteps, hardwareTriggerCount, categoryName,
            synergyEvents: synergyResult.synergyEvents,
            chainDepth: synergyResult.chainDepth,
            retriggerCount: synergyResult.retriggerCount
        };
    };

    const normalizeSavedRun = (raw, context) => {
        const { RUN_SAVE_VERSION, RUN_PHASES, WAGER_TUNING, DEFAULT_RUN_BUILD, BUILD_IDS } = context;
        if (!raw || typeof raw !== 'object') return null;
        if (typeof raw.personaId !== 'string' || !Array.isArray(raw.dice) || raw.dice.length !== 5) return null;
        const normalized = { ...raw };
        normalized.version = RUN_SAVE_VERSION;
        if (!RUN_PHASES.includes(normalized.phase)) normalized.phase = 'PLAY';
        if (!Array.isArray(normalized.consumables)) normalized.consumables = [];
        if (!normalized.handLevels || typeof normalized.handLevels !== 'object' || Array.isArray(normalized.handLevels)) normalized.handLevels = {};
        if (typeof normalized.flowStreak !== 'number' || Number.isNaN(normalized.flowStreak)) normalized.flowStreak = 0;
        if (typeof normalized.gambleStake !== 'number' || Number.isNaN(normalized.gambleStake)) normalized.gambleStake = 0;
        if (!normalized.activeWager || typeof normalized.activeWager !== 'object') normalized.activeWager = null;
        else {
            normalized.activeWager = {
                stake: Math.max(0, Math.floor(Number(normalized.activeWager.stake) || 0)),
                threshold: Math.max(WAGER_TUNING.baseThreshold, Math.floor(Number(normalized.activeWager.threshold) || WAGER_TUNING.baseThreshold))
            };
            if (!normalized.activeWager.stake) normalized.activeWager = null;
        }
        if (!normalized.currentRouteEffect || typeof normalized.currentRouteEffect !== 'object') normalized.currentRouteEffect = null;
        else if (!Array.isArray(normalized.currentRouteEffect.effects)) normalized.currentRouteEffect = { ...normalized.currentRouteEffect, effects: [] };
        if (typeof normalized.arcId !== 'string' || !normalized.arcId) normalized.arcId = 'witness';
        if (!normalized.runStats || typeof normalized.runStats !== 'object') {
            normalized.runStats = { totalHeat: 0, biggestHustle: 0, finalBoss: '', build: { ...DEFAULT_RUN_BUILD } };
        } else {
            const rs = normalized.runStats;
            const b = rs.build && typeof rs.build === 'object' ? rs.build : {};
            normalized.runStats = {
                totalHeat: typeof rs.totalHeat === 'number' && !Number.isNaN(rs.totalHeat) ? rs.totalHeat : 0,
                biggestHustle: typeof rs.biggestHustle === 'number' && !Number.isNaN(rs.biggestHustle) ? rs.biggestHustle : 0,
                finalBoss: typeof rs.finalBoss === 'string' ? rs.finalBoss : '',
                build: {
                    primary: typeof b.primary === 'string' ? b.primary : BUILD_IDS.UNKNOWN,
                    peakConfidence: typeof b.peakConfidence === 'number' && !Number.isNaN(b.peakConfidence) ? b.peakConfidence : 0,
                    keyItems: Array.isArray(b.keyItems) ? b.keyItems.filter((x) => typeof x === 'string') : []
                }
            };
        }
        return normalized;
    };

    return Object.freeze({ resolveDice, calculateScore, normalizeSavedRun });
})();
</script>

<script id="gutterbones-onboarding">
const GutterbonesOnboarding = (() => {
    const THRESHOLDS = Object.freeze({
        BASIC_COMBOS: 2,
        ALL_CATEGORIES: 5,
        RARE_FACES: 3
    });

    const getAvailableCategoryIds = (totalRuns = 0) => {
        const runs = Math.max(0, Math.floor(Number(totalRuns) || 0));
        if (runs < THRESHOLDS.BASIC_COMBOS) {
            return ['ONES', 'TWOS', 'THREES', 'FOURS', 'FIVES', 'SIXES', 'TOK', 'FH', 'C'];
        }
        if (runs < THRESHOLDS.ALL_CATEGORIES) {
            return ['ONES', 'TWOS', 'THREES', 'FOURS', 'FIVES', 'SIXES', 'TOK', 'FOK', 'FH', 'C'];
        }
        return null;
    };

    const unlockRunForCategory = (categoryId) => {
        if (categoryId === 'FOK') return THRESHOLDS.BASIC_COMBOS;
        if (categoryId === 'SS' || categoryId === 'LS' || categoryId === 'Y') return THRESHOLDS.ALL_CATEGORIES;
        return 0;
    };

    const getCategoryUnlockInfo = (totalRuns, allCategoryIds) => {
        const runs = Math.max(0, Math.floor(Number(totalRuns) || 0));
        const all = Array.isArray(allCategoryIds) ? allCategoryIds : [];
        const limited = getAvailableCategoryIds(runs);
        const available = limited === null ? all : limited.filter((id) => all.includes(id));
        const availableSet = new Set(available);
        const locked = all.filter((id) => !availableSet.has(id));
        const lockedDetails = locked.map((id) => {
            const need = unlockRunForCategory(id);
            const runsUntil = need > runs ? need - runs : 0;
            return { id, unlockAtRun: need, runsUntil };
        });
        let nextThreshold = null;
        let runsUntilNext = 0;
        if (runs < THRESHOLDS.BASIC_COMBOS) {
            nextThreshold = THRESHOLDS.BASIC_COMBOS;
            runsUntilNext = THRESHOLDS.BASIC_COMBOS - runs;
        } else if (runs < THRESHOLDS.ALL_CATEGORIES) {
            nextThreshold = THRESHOLDS.ALL_CATEGORIES;
            runsUntilNext = THRESHOLDS.ALL_CATEGORIES - runs;
        }
        return {
            totalRuns: runs,
            available,
            locked,
            lockedDetails,
            nextThreshold,
            runsUntilNext
        };
    };

    return Object.freeze({
        THRESHOLDS,
        getAvailableCategoryIds,
        getCategoryUnlockInfo,
        unlockRunForCategory
    });
})();
</script>

<script id="gutterbones-tutorial">
const GutterbonesTutorial = (() => {
    /** Standard pip values per tutorial roll (only unkept slots apply on rerolls). */
    const ROLL_TABLE = Object.freeze([
        [2, 2, 3, 4, 5],
        [2, 2, 3, 5, 6],
        [2, 2, 3, 3, 6]
    ]);

    const STEPS = Object.freeze([
        {
            id: 'opening_sniff',
            advance: 'ack',
            focus: 'dice-lane',
            caption: 'The fixer slipped you a free SNIFF — one bone rerolled on the house. That 25% stash bar? Programs, not Pills. Remember it.'
        },
        {
            id: 'roll',
            advance: 'roll_settled',
            focus: 'roll-btn',
            caption: 'Throw the bones. Hit ROLL and let the alley decide what sticks.'
        },
        {
            id: 'hold',
            advance: 'hold_toggle',
            focus: 'dice-lane',
            caption: 'Tap a die to lock it. Kept faces ride along on the next throw.'
        },
        {
            id: 'roll_again',
            advance: 'roll_settled',
            focus: 'roll-btn',
            caption: 'Again. Only the loose bones spin — your locks stay put.'
        },
        {
            id: 'payout',
            advance: 'payout',
            focus: 'payout-sheet',
            caption: 'Pick a row on THE PAYOUTS sheet. That hand is your hustle — one play gone either way.'
        },
        {
            id: 'quota',
            advance: 'ack',
            focus: 'heat-quota',
            caption: 'Heat climbs toward the quota. Burn through your plays before the street goes cold.'
        },
        {
            id: 'pill',
            advance: 'pill',
            focus: 'dice-lane',
            caption: 'Pills reroll a single bone. Tap the PILL badge on one die — stash stays out of it.'
        },
        {
            id: 'clear_round',
            advance: 'round_clear',
            focus: 'payout-sheet',
            caption: 'One more score clears the round. Same drill — lock, roll, cash a row.'
        },
        {
            id: 'shop',
            advance: 'ack',
            focus: 'shop-panel',
            caption: 'Back Alley shop: grab hardware, carve faces, or pocket cash. When you are set, pick a route and keep climbing.'
        }
    ]);

    const TUNING = Object.freeze({
        roundTarget: 28,
        openingStash: 25,
        plays: 5,
        pills: 2,
        openingSniffSlot: 3
    });

    let rollCounter = 0;

    const resetRollCounter = () => { rollCounter = 0; };

    const nextRollIndex = () => {
        const idx = rollCounter;
        rollCounter += 1;
        return idx;
    };

    const valueForSlot = (rollIndex, slotIndex) => {
        const row = ROLL_TABLE[Math.min(rollIndex, ROLL_TABLE.length - 1)];
        return row[slotIndex % row.length];
    };

    const resolveSettledValues = (rollIndex, activeMask) => {
        const row = ROLL_TABLE[Math.min(rollIndex, ROLL_TABLE.length - 1)];
        return activeMask.map((active, i) => (active ? row[i] : null));
    };

    const stepByIndex = (i) => STEPS[Math.max(0, Math.min(i, STEPS.length - 1))];

    const advanceForAction = (step, action) => {
        if (!step) return false;
        if (step.advance === action) return true;
        if (action === 'roll_settled' && step.advance === 'roll_settled') return true;
        return false;
    };

    return Object.freeze({
        STEPS,
        ROLL_TABLE,
        TUNING,
        resetRollCounter,
        nextRollIndex,
        valueForSlot,
        resolveSettledValues,
        stepByIndex,
        advanceForAction
    });
})();
</script>

<script id="gutterbones-replay">
const GutterbonesReplay = (() => {
    const RUN_MODIFIERS = Object.freeze({
        ODD_EVEN_SPLIT: { id: 'ODD_EVEN_SPLIT', name: 'Odd/Even Split', desc: 'Odd slots +8 chips; even slots +0.5 mult (once per hand).' },
        STRAIGHT_FOCUS: { id: 'STRAIGHT_FOCUS', name: 'Straight Focus', desc: 'Short/Long Run hands +25 chips.' },
        HOLD_CHARGE: { id: 'HOLD_CHARGE', name: 'Hold Charge', desc: '+3 chips per locked die when you score.' },
        RISK_BONE: { id: 'RISK_BONE', name: 'Risk Bone', desc: 'Rolling a 1 on any die costs $1 (max once per roll).' },
        COPY_LAST: { id: 'COPY_LAST', name: 'Echo Hand', desc: 'Repeat last valid hand category at 50% heat.' },
        PIP_SUM: { id: 'PIP_SUM', name: 'Pip Sum', desc: '+1 chip per pip on the table (max +30).' },
        SACRIFICE_SLOT: { id: 'SACRIFICE_SLOT', name: 'Sacrifice', desc: 'Blank lowest slot: +15 chips, -1 play next round (once).' },
        STASH_INTEREST: { id: 'STASH_INTEREST', name: 'Stash Interest', desc: 'End of shop: +$1 per 25% unspent stash.' }
    });

    const EXTRA_PATHS = Object.freeze([
        { id: 'GRIND', name: 'GRIND ROUTE', desc: '+12% quota, +1 Pill next round.', mod: 1.12, discardDelta: 1, color: 'border-orange-500 text-orange-300' },
        { id: 'HIGHWIRE', name: 'HIGH WIRE', desc: '+35% quota, shop refreshes cost $5 less.', mod: 1.35, shopRefreshDiscount: 5, color: 'border-violet-500 text-violet-300' }
    ]);

    const PLAY_UNLOCKS = Object.freeze([
        { id: 'unlock-grinder', title: 'The Grinder', condition: 'Clear round 3 once', check: (m) => (m.bestRoundReached || 0) >= 3, reward: { personaId: 'GRINDER' } },
        { id: 'unlock-odd-job', title: 'Odd Job', condition: 'Score 200+ heat in one run', check: (m) => (m.bestHeat || 0) >= 200, reward: { modifierPool: ['ODD_EVEN_SPLIT'] } },
        { id: 'unlock-smuggler-route', title: 'Smuggler\'s Cut', condition: 'Complete 2 runs', check: (m) => (m.completedRuns || 0) >= 2, reward: { pathId: 'GRIND' } },
        { id: 'unlock-highwire', title: 'High Wire', condition: 'Win a run (10 rounds)', check: (m) => (m.completedRuns || 0) >= 1 && (m.bestHeat || 0) >= 400, reward: { pathId: 'HIGHWIRE' } },
        { id: 'unlock-risk-kit', title: 'Risk Kit', condition: 'Daily run best ≥ 120', check: (m) => (m.dailyBestHeat || 0) >= 120, reward: { modifierPool: ['RISK_BONE', 'SACRIFICE_SLOT'] } },
        { id: 'unlock-archivist', title: 'Archivist', condition: 'Open Records 5 times', check: (m) => (m.recordsViews || 0) >= 5, reward: { modifierPool: ['COPY_LAST', 'PIP_SUM', 'STASH_INTEREST'] } }
    ]);

    const utcDateKey = (d = new Date()) => d.toISOString().slice(0, 10);

    const hashString = (str) => {
        let h = 2166136261;
        for (let i = 0; i < str.length; i += 1) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return h >>> 0;
    };

    const mulberry32 = (seed) => {
        let a = seed >>> 0;
        return () => {
            a |= 0;
            a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    };

    const dailySeed = (dateKey = utcDateKey()) => hashString(`gutterbones-daily:${dateKey}`);

    const dailyShareString = ({ dateKey, heat, rounds, emoji = '🎲' }) => {
        const grid = ['🟥', '🟨', '🟩', '⬛'];
        const pick = (n) => grid[n % grid.length];
        const pat = [heat, rounds, hashString(dateKey) % 999].map(pick).join('');
        return `Gutterbones ${dateKey} ${pat} heat:${heat} r:${rounds}`;
    };

    const BASE_ROUTE_IDS = Object.freeze(['LOCAL', 'PAWN', 'HIDEOUT', 'SMUGGLE', 'VIP', 'BOSS', 'RAID']);
    const DAILY_MODIFIER_COUNT = 2;

    const applyRunModifiersToScore = (result, catId, dice, kept, modifierIds = [], lastHand = null, extra = {}) => {
        if (!result?.valid || !modifierIds?.length) return result;
        let chips = result.chips || 0;
        let mult = result.mult || 1;
        const ids = new Set(modifierIds);
        if (ids.has('ODD_EVEN_SPLIT')) {
            dice.forEach((d, i) => {
                if ((i + 1) % 2 === 1) chips += 6;
                else mult += 0.35;
            });
        }
        if (ids.has('STRAIGHT_FOCUS') && (catId === 'SS' || catId === 'LS')) chips += 18;
        if (ids.has('HOLD_CHARGE')) chips += (kept || []).filter(Boolean).length * 2;
        if (ids.has('PIP_SUM')) {
            const pip = dice.reduce((s, d) => s + (d.value || 0), 0);
            chips += Math.min(22, pip);
        }
        if (ids.has('COPY_LAST') && lastHand?.category && lastHand.category === catId) {
            chips += Math.floor((lastHand.total || 0) * 0.4);
        }
        if (extra.sacrificeBonus) chips += extra.sacrificeBonus;
        const flowMult = result.flowMult || 1;
        const total = Math.floor(chips * mult * flowMult);
        return { ...result, chips, mult, total };
    };

    const applySacrificeToDice = (dice) => {
        if (!Array.isArray(dice) || dice.length === 0) return { dice, bonus: 0, applied: false };
        let minIdx = 0;
        let minVal = dice[0]?.value ?? 6;
        dice.forEach((d, i) => {
            const v = d?.value ?? 6;
            if (v < minVal) {
                minVal = v;
                minIdx = i;
            }
        });
        const next = dice.map((d, i) => (i === minIdx
            ? { ...d, value: 0, faceId: null, faceLabel: 'SAC', faceStyle: null, type: 'standard' }
            : d));
        return { dice: next, bonus: 12, applied: true };
    };

    const riskBoneToll = (dice, activeMask) => {
        if (!Array.isArray(dice) || !Array.isArray(activeMask)) return 0;
        const rolledOne = dice.some((d, i) => activeMask[i] && d.value === 1);
        return rolledOne ? 1 : 0;
    };

    const stashInterestPayout = (stashPct = 0) => Math.max(0, Math.floor((stashPct || 0) / 25));

    const getDailyRunConfig = (dateKey = utcDateKey()) => {
        const seed = dailySeed(dateKey);
        const rng = mulberry32(seed);
        const allMods = Object.keys(RUN_MODIFIERS);
        const modifierIds = [];
        while (modifierIds.length < DAILY_MODIFIER_COUNT && modifierIds.length < allMods.length) {
            const pick = allMods[Math.floor(rng() * allMods.length)];
            if (!modifierIds.includes(pick)) modifierIds.push(pick);
        }
        return { dateKey, seed, modifierIds, rng };
    };

    const canStartDaily = (meta, dateKey = utcDateKey()) => {
        const attempts = meta?.dailyAttempts || {};
        return !attempts[dateKey]?.used;
    };

    const recordDailyResult = (meta, { dateKey = utcDateKey(), heat = 0, round = 1, victory = false } = {}) => {
        const attempts = { ...(meta?.dailyAttempts || {}) };
        const prev = attempts[dateKey] || {};
        const bestHeat = Math.max(prev.bestHeat || 0, heat);
        attempts[dateKey] = {
            used: true,
            bestHeat,
            lastHeat: heat,
            lastRound: round,
            victory: !!victory || !!prev.victory
        };
        return {
            ...meta,
            dailyAttempts: attempts,
            dailyBestHeat: Math.max(meta?.dailyBestHeat || 0, bestHeat),
            dailyLastDate: dateKey
        };
    };

    const isExtraPath = (pathId) => EXTRA_PATHS.some((p) => p.id === pathId);

    const isPathAvailable = (path, meta) => {
        if (!path?.id) return false;
        if (!isExtraPath(path.id)) return true;
        return (meta?.unlockedRouteIds || []).includes(path.id);
    };

    const filterPathsForMeta = (paths, meta) => (paths || []).filter((p) => isPathAvailable(p, meta));

    const syncPlayUnlocks = (meta) => {
        let next = { ...meta };
        const earned = new Set(next.unlockedPlayIds || []);
        let changed = false;
        PLAY_UNLOCKS.forEach((u) => {
            if (earned.has(u.id)) return;
            if (!u.check(next)) return;
            earned.add(u.id);
            changed = true;
            const r = u.reward || {};
            if (r.personaId) {
                next.unlockedPersonaIds = [...new Set([...(next.unlockedPersonaIds || []), r.personaId])];
            }
            if (r.modifierPool?.length) {
                next.unlockedModifierIds = [...new Set([...(next.unlockedModifierIds || []), ...r.modifierPool])];
            }
            if (r.pathId) {
                next.unlockedRouteIds = [...new Set([...(next.unlockedRouteIds || []), r.pathId])];
            }
        });
        if (changed) next.unlockedPlayIds = [...earned];
        return next;
    };

    const modifierShopOffers = (meta, rng = Math.random) => {
        const pool = (meta?.unlockedModifierIds || []).filter((id) => RUN_MODIFIERS[id]);
        if (!pool.length || rng() > 0.22) return [];
        const id = pool[Math.floor(rng() * pool.length)];
        const mod = RUN_MODIFIERS[id];
        return [{
            id: `mod-offer-${id}`,
            type: 'runModifier',
            modifierId: id,
            name: mod.name,
            desc: mod.desc,
            cost: 14,
            rarity: 'rare'
        }];
    };

    const personaStartModifiers = (personaId) => {
        if (personaId === 'GRINDER') return ['HOLD_CHARGE', 'STRAIGHT_FOCUS'];
        return [];
    };

    const evaluateUnlocks = (meta) => PLAY_UNLOCKS.map((u) => ({
        ...u,
        unlocked: !!meta?.unlockedPlayIds?.includes(u.id) || u.check(meta || {})
    }));

    return Object.freeze({
        RUN_MODIFIERS,
        EXTRA_PATHS,
        PLAY_UNLOCKS,
        BASE_ROUTE_IDS,
        utcDateKey,
        dailySeed,
        mulberry32,
        dailyShareString,
        getDailyRunConfig,
        canStartDaily,
        recordDailyResult,
        applyRunModifiersToScore,
        applySacrificeToDice,
        riskBoneToll,
        stashInterestPayout,
        isPathAvailable,
        filterPathsForMeta,
        syncPlayUnlocks,
        modifierShopOffers,
        personaStartModifiers,
        evaluateUnlocks
    });
})();
</script>

<script id="gutterbones-routes">
const GutterbonesRoutes = (() => {
    const BOSS_TUNING = Object.freeze({
        debtQuotaPenaltyRatio: 1.5,
        debtQuotaPenaltyCap: 120,
        earlyBossRoundCap: 4,
        earlyBouncerRelief: 0.9,
        raidQuotaRelief: 0.92,
        bossPathTargetRelief: 0.93
    });

    const EARLY_GAME_TUNING = Object.freeze({
        debtPenaltyStartsRound: 4
    });

    const ROUND_CURVE_TUNING = Object.freeze({
        earlyMaxRound: 4,
        midMaxRound: 7,
        early: { pathModWeight: 0.72, flatIncrease: 22 },
        mid: { pathModWeight: 0.92, flatIncrease: 44 },
        late: { pathModWeight: 1.08, flatIncrease: 52 }
    });

    const PROGRESSION_GUARDRAILS = Object.freeze({
        minGrowthRate: 1.08,
        earlyMaxGrowthRate: 1.35,
        midMaxGrowthRate: 1.42,
        lateMaxGrowthRate: 1.5
    });

    const INSANE_CONTRACT_MODIFIERS = Object.freeze({
        targetMultiplier: 1.28,
        debtPenaltyMultiplier: 1.35,
        playPenalty: 1
    });

    const roundCurveFor = (nextRound) => (
        nextRound <= ROUND_CURVE_TUNING.earlyMaxRound
            ? ROUND_CURVE_TUNING.early
            : nextRound <= ROUND_CURVE_TUNING.midMaxRound
                ? ROUND_CURVE_TUNING.mid
                : ROUND_CURVE_TUNING.late
    );

    const growthCapFor = (nextRound) => (
        nextRound <= ROUND_CURVE_TUNING.earlyMaxRound
            ? PROGRESSION_GUARDRAILS.earlyMaxGrowthRate
            : nextRound <= ROUND_CURVE_TUNING.midMaxRound
                ? PROGRESSION_GUARDRAILS.midMaxGrowthRate
                : PROGRESSION_GUARDRAILS.lateMaxGrowthRate
    );

    const applyBossAdjustedTarget = (baseTarget, boss, roundNum) => {
        if (!boss?.applyTarget) return baseTarget;
        let adjusted = boss.applyTarget(baseTarget);
        if (boss.id === 'BOUNCER' && roundNum <= BOSS_TUNING.earlyBossRoundCap) {
            adjusted = Math.floor(adjusted * BOSS_TUNING.earlyBouncerRelief);
        }
        if (boss.id === 'THE_RAID') {
            adjusted = Math.floor(adjusted * BOSS_TUNING.raidQuotaRelief);
        }
        return adjusted;
    };

    const describePathModifiers = (path) => {
        if (!path) return [];
        const notes = [];
        if (path.mod && path.mod !== 1) notes.push(`Quota x${path.mod.toFixed(2)} (scaled by round curve)`);
        if (path.reward) notes.push(`+$${path.reward} cash on pick`);
        if (path.fillStash) notes.push('Stash to 100% on pick');
        if (path.handDelta) notes.push(`${path.handDelta > 0 ? '+' : ''}${path.handDelta} play next round`);
        if (path.discardDelta) notes.push(`${path.discardDelta > 0 ? '+' : ''}${path.discardDelta} pill next round`);
        if (path.grantRandomConsumable) notes.push('Random one-shot on pick');
        return notes;
    };

    const sideBetPayout = (stake, payoutMultiplier = 1.75) => (
        Math.max(stake + 1, Math.round(stake * payoutMultiplier))
    );

    const wagerThresholdForRound = (round, tuning = { baseThreshold: 110, roundThresholdStep: 8 }) => (
        tuning.baseThreshold + Math.max(0, round - 1) * tuning.roundThresholdStep
    );

    const projectNextRound = ({
        path,
        round,
        target,
        debt = 0,
        insaneContract = false,
        hasLedger = false,
        personaPlays = 4,
        personaPills = 3
    }) => {
        const warnings = [];
        const effectLines = describePathModifiers(path);
        const nextRound = Math.max(1, Math.floor(Number(round) || 0)) + 1;
        const currentTarget = Math.max(1, Math.floor(Number(target) || 0));
        const roundCurve = roundCurveFor(nextRound);
        const scaledPathMod = 1 + (((path?.mod || 1) - 1) * roundCurve.pathModWeight);
        let nextTarget = Math.floor(currentTarget * scaledPathMod) + roundCurve.flatIncrease;

        let debtPenaltyApplied = 0;
        if (!hasLedger && debt > 0 && nextRound >= EARLY_GAME_TUNING.debtPenaltyStartsRound) {
            debtPenaltyApplied = Math.min(
                BOSS_TUNING.debtQuotaPenaltyCap,
                Math.floor(debt * BOSS_TUNING.debtQuotaPenaltyRatio)
            );
            if (insaneContract) {
                debtPenaltyApplied = Math.floor(debtPenaltyApplied * INSANE_CONTRACT_MODIFIERS.debtPenaltyMultiplier);
            }
            nextTarget += debtPenaltyApplied;
            effectLines.push(`Debt pressure +${debtPenaltyApplied} quota`);
        }

        if (path?.boss && nextRound <= BOSS_TUNING.earlyBossRoundCap) {
            nextTarget = Math.floor(nextTarget * BOSS_TUNING.bossPathTargetRelief);
            effectLines.push('Boss turf: early-route quota relief applied');
        }

        const growthCap = growthCapFor(nextRound);
        const minTarget = Math.floor(currentTarget * PROGRESSION_GUARDRAILS.minGrowthRate);
        const maxTarget = Math.floor(currentTarget * growthCap);
        const beforeGuardrail = nextTarget;
        nextTarget = Math.max(minTarget, Math.min(nextTarget, maxTarget));
        if (nextTarget === minTarget && beforeGuardrail < minTarget) {
            warnings.push(`Quota growth clamped to minimum (+${Math.round((PROGRESSION_GUARDRAILS.minGrowthRate - 1) * 100)}%)`);
            effectLines.push(`Guardrail: quota floored at ${nextTarget}`);
        } else if (nextTarget === maxTarget && beforeGuardrail > maxTarget) {
            warnings.push(`Quota growth clamped to maximum (+${Math.round((growthCap - 1) * 100)}%)`);
            effectLines.push(`Guardrail: quota capped at ${nextTarget}`);
        }

        if (insaneContract) {
            nextTarget = Math.floor(nextTarget * INSANE_CONTRACT_MODIFIERS.targetMultiplier);
            effectLines.push('Insane contract: quota +28%');
        }

        const delta = nextTarget - currentTarget;
        effectLines.unshift(`Next quota base: ${nextTarget} (${delta >= 0 ? '+' : ''}${delta} vs this round)`);

        const nextTargetDisplay = applyBossAdjustedTarget(nextTarget, path?.boss, nextRound);
        if (path?.boss?.applyTarget && nextTargetDisplay !== nextTarget) {
            effectLines.push(`Boss ${path.boss.name}: displayed quota ~${nextTargetDisplay} (applyTarget during round)`);
        } else if (path?.boss) {
            effectLines.push(`Boss ${path.boss.name}: ${path.boss.desc}`);
        }

        const baseHands = Math.max(
            1,
            personaPlays
                - (hasLedger && debt > 0 ? 1 : 0)
                - (insaneContract ? INSANE_CONTRACT_MODIFIERS.playPenalty : 0)
        );
        const nextHands = Math.max(1, baseHands + (path?.handDelta || 0));
        const nextDiscards = Math.max(0, personaPills + (path?.discardDelta || 0));

        if (nextHands !== personaPlays) {
            effectLines.push(`Plays next round: ${nextHands}`);
        }
        if (nextDiscards !== personaPills) {
            effectLines.push(`Pills next round: ${nextDiscards}`);
        }

        return {
            nextRound,
            nextTarget,
            nextTargetDisplay,
            nextHands,
            nextDiscards,
            effectLines,
            warnings
        };
    };

    return Object.freeze({
        BOSS_TUNING,
        ROUND_CURVE_TUNING,
        projectNextRound,
        applyBossAdjustedTarget,
        describePathModifiers,
        sideBetPayout,
        wagerThresholdForRound
    });
})();
</script>

<script id="gutterbones-gamble">
const GutterbonesGamble = (() => {
    const TUNING = Object.freeze({
        minRound: 3,
        stakeRate: 0.22,
        stakeCap: 30,
        minStake: 5,
        flowWinBonusPerStreak: 0.02,
        flowWinBonusCap: 0.12,
        tiers: Object.freeze([
            {
                id: 'SOFT',
                name: 'Soft Touch',
                blurb: 'Smaller stake, better odds.',
                stakeMult: 0.65,
                winChance: 0.58,
                winMult: 1,
                lossMult: 1
            },
            {
                id: 'FAIR',
                name: 'Fair Flip',
                blurb: 'Street-standard double or nothing.',
                stakeMult: 1,
                winChance: 0.5,
                winMult: 1,
                lossMult: 1
            },
            {
                id: 'HARD',
                name: 'Hard Flip',
                blurb: 'Long odds, bigger score if it lands.',
                stakeMult: 1,
                winChance: 0.38,
                winMult: 1.5,
                lossMult: 1
            }
        ])
    });

    const tierById = (tierId) => TUNING.tiers.find((t) => t.id === tierId) || TUNING.tiers[1];

    const baseStake = (gold) => {
        const cash = Math.max(0, Math.floor(Number(gold) || 0));
        return Math.min(
            TUNING.stakeCap,
            Math.max(TUNING.minStake, Math.floor(cash * TUNING.stakeRate))
        );
    };

    const stakeForTier = (gold, tierId) => {
        const tier = tierById(tierId);
        const scaled = Math.floor(baseStake(gold) * tier.stakeMult);
        return Math.max(TUNING.minStake, Math.min(TUNING.stakeCap, scaled));
    };

    const flowWinBonus = (flowStreak = 0) => (
        Math.min(TUNING.flowWinBonusCap, Math.max(0, Math.floor(Number(flowStreak) || 0)) * TUNING.flowWinBonusPerStreak)
    );

    const winProbability = (tierId, flowStreak = 0) => {
        const tier = tierById(tierId);
        const p = tier.winChance + flowWinBonus(flowStreak);
        return Math.min(0.95, Math.max(0.05, p));
    };

    const resolveFlip = ({ tierId = 'FAIR', flowStreak = 0, gold = 0, random = Math.random() }) => {
        const tier = tierById(tierId);
        const stake = stakeForTier(gold, tier.id);
        const pWin = winProbability(tier.id, flowStreak);
        const won = random < pWin;
        const winAmount = won ? Math.max(1, Math.round(stake * tier.winMult)) : 0;
        const lossAmount = won ? 0 : Math.max(1, Math.round(stake * tier.lossMult));
        return {
            won,
            stake,
            pWin,
            winAmount,
            lossAmount,
            tierId: tier.id,
            tierName: tier.name
        };
    };

    const allTiers = () => TUNING.tiers.slice();

    const formatWinPercent = (p) => `${Math.round(p * 100)}%`;

    return Object.freeze({
        TUNING,
        tierById,
        baseStake,
        stakeForTier,
        flowWinBonus,
        winProbability,
        resolveFlip,
        allTiers,
        formatWinPercent
    });
})();
</script>

        if (totals.length >= 4) {
            const mean = totals.reduce((a, b) => a + b, 0) / totals.length;
            const variance = totals.reduce((a, t) => a + (t - mean) ** 2, 0) / Math.max(1, totals.length);
            const stdev = Math.sqrt(variance);
            const cv = mean > 8 ? stdev / mean : 1;
            if (cv < 0.38 && mean > 22) { w += 3; sig[BUILD_IDS.SET_CONSISTENCY].push('hist:low_variance'); }
            if (totals.length >= 6) { w += 0.8; sig[BUILD_IDS.SET_CONSISTENCY].push('hist:volume'); }
        }
        const specials = countSpecialFaceSlots(dice);
        if (specials <= 4 && totals.length >= 3) { w += 1.2; sig[BUILD_IDS.SET_CONSISTENCY].push('board:clean_loadout'); }
        weights[BUILD_IDS.SET_CONSISTENCY] = w;

        w = chaosCount * 1.4;
        if (diceShowsFace(dice, 'WIREBAG_FACE')) { w += 0.8; sig[BUILD_IDS.CHAOS].push('board:WIREBAG'); }
        if (diceShowsFace(dice, 'GHOST_FACE')) { w += 0.7; sig[BUILD_IDS.CHAOS].push('board:GHOST'); }
        if (diceShowsFace(dice, 'WILD_FACE')) { w += 0.5; sig[BUILD_IDS.CHAOS].push('board:WILD'); }
        if ((histText.match(/WIRE|SHIV|GHOST|PACT/g) || []).length >= 5) { w += 1.2; sig[BUILD_IDS.CHAOS].push('hist:volatile'); }
        weights[BUILD_IDS.CHAOS] = w;

        let primaryBuild = BUILD_IDS.UNKNOWN;
        let best = 1.35;
        Object.keys(weights).forEach((k) => {
            if (weights[k] > best) {
                best = weights[k];
                primaryBuild = k;
            }
        });

        const sorted = Object.entries(weights).sort((a, b) => b[1] - a[1]);
        let secondaryTag = null;
        if (primaryBuild !== BUILD_IDS.UNKNOWN && sorted.length > 1) {
            const topW = sorted[0][1];
            const runner = sorted.find(([id]) => id !== primaryBuild);
            if (runner && runner[1] >= topW * 0.38 && runner[1] >= 1.05) {
                const ui = BUILD_UI[runner[0]];
                if (ui) secondaryTag = ui.label;
            }
        }

        const denom = Object.values(weights).reduce((a, v) => a + v, 0) + 0.01;
        let confidence = primaryBuild === BUILD_IDS.UNKNOWN ? 0 : Math.min(1, best / (denom * 0.72 + 0.35));
        if (totals.length < 2 && primaryBuild !== BUILD_IDS.UNKNOWN) confidence *= 0.82;

        const signals = primaryBuild === BUILD_IDS.UNKNOWN
            ? ['run:still_open']
            : (sig[primaryBuild] || []).slice(0, 8);

        return { primaryBuild, secondaryTag, confidence, signals };
    };

        if (!events?.length || typeof GutterbonesRules?.resolveDice !== 'function') return [];
        const { resolved, destroyed } = GutterbonesRules.resolveDice(dice);
        const bloodLike = (d) => d && (d.type === 'blood' || d.type === 'destructive' || d.faceId === 'BLOOD_6' || d.faceId === 'SHIV_FACE');
        const links = [];
        const seen = new Set();
        const add = (a, b, id) => {
            const key = `${Math.min(a, b)}-${Math.max(a, b)}-${id}`;
            if (seen.has(key)) return;
            seen.add(key);
            links.push({ from: a, to: b, id });
        };
        if (events.some((e) => e.id === 'blood_ripple')) {
            resolved.forEach((d, i) => {
                if (destroyed.has(i) || d.faceId !== 'BLOOD_6') return;
                [i - 1, i + 1].forEach((j) => {
                    if (j < 0 || j > 4 || destroyed.has(j)) return;
                    if (bloodLike(resolved[j])) add(i, j, 'blood_ripple');
                });
            });
        }
        if (events.some((e) => e.id === 'ghost_echo')) {
            for (let i = 0; i < 5; i += 1) {
                if (destroyed.has(i) || resolved[i].faceId !== 'GHOST_FACE') continue;
                [i - 1, i + 1].forEach((j) => {
                    if (j < 0 || j > 4 || destroyed.has(j)) return;
                    if (resolved[j].faceId === 'ECHO_FACE' || resolved[j].isEchoed) add(i, j, 'ghost_echo');
                });
            }
        }
        if (events.some((e) => e.id === 'wire_feed')) {
            for (let i = 0; i < 5; i += 1) {
                if (destroyed.has(i) || resolved[i].faceId !== 'WIREBAG_FACE') continue;
                [i - 1, i + 1].forEach((j) => {
                    if (j < 0 || j > 4 || destroyed.has(j)) return;
                    if (resolved[j].faceId === 'GOLD_FACE') add(i, j, 'wire_feed');
                });
            }
        }
        return links;
    };

    const mergeMetaState = (stored = {}) => ({

        unlockedPersonaIds: [...new Set([...(DEFAULT_META_STATE.unlockedPersonaIds || []), ...((stored && stored.unlockedPersonaIds) || [])])],
        unlockedFaceIds: [...new Set([...(DEFAULT_META_STATE.unlockedFaceIds || []), ...((stored && stored.unlockedFaceIds) || [])])],
        unlockedHardwareIds: [...new Set([...(DEFAULT_META_STATE.unlockedHardwareIds || []), ...((stored && stored.unlockedHardwareIds) || [])])],
        purchasedUpgradeIds: [...new Set(((stored && stored.purchasedUpgradeIds) || []))],
        unlockedPlayIds: [...new Set([...(stored?.unlockedPlayIds || [])])],
        unlockedModifierIds: [...new Set([...(stored?.unlockedModifierIds || [])])],
        unlockedRouteIds: [...new Set([...(stored?.unlockedRouteIds || [])])],
        dailyAttempts: { ...(stored?.dailyAttempts || {}) },
        bestRoundReached: stored?.bestRoundReached || 0,
        dailyBestHeat: stored?.dailyBestHeat || 0,
        dailyLastDate: stored?.dailyLastDate || null,
        recordsViews: stored?.recordsViews || 0
    });

    const loadJson = (key) => {
        try {
            const raw = window.localStorage?.getItem(key);
            return raw ? JSON.parse(raw) : null;
        } catch (err) {
            console.warn('Unable to load local save data', err);
            return null;
        }
    };

    const saveJson = (key, value) => {
        try {
            window.localStorage?.setItem(key, JSON.stringify(value));
        } catch (err) {
            console.warn('Unable to save local data', err);
        }
    };

    const loadMetaState = () => {
        let meta = mergeMetaState(loadJson(STORAGE_KEYS.meta) || {});
        if (typeof GutterbonesReplay !== 'undefined' && GutterbonesReplay.syncPlayUnlocks) {
            meta = GutterbonesReplay.syncPlayUnlocks(meta);
        }
        return meta;
    };
    const saveMetaState = (meta) => saveJson(STORAGE_KEYS.meta, meta);

    const normalizeSavedRun = (raw) => GutterbonesRules.normalizeSavedRun(raw, {
        RUN_SAVE_VERSION, RUN_PHASES, WAGER_TUNING, DEFAULT_RUN_BUILD, BUILD_IDS
    });

    const loadSavedRun = () => normalizeSavedRun(loadJson(STORAGE_KEYS.run));
    const saveSavedRun = (run) => saveJson(STORAGE_KEYS.run, { ...run, version: RUN_SAVE_VERSION });
    const clearSavedRun = () => {
        try { window.localStorage?.removeItem(STORAGE_KEYS.run); } catch (err) { console.warn('Unable to clear saved run', err); }

    const itemById = (id) => FACE_DATABASE[id] || DEVISES[id] || CONSUMABLES[id] || null;
    const bossById = (id) => BOSSES[id] || null;
    const hydrateItem = (item) => item?.id && itemById(item.id) ? { ...itemById(item.id), ...item } : item;
    const hydratePath = (path) => path ? { ...path, boss: path.bossId ? bossById(path.bossId) : (path.boss?.id ? bossById(path.boss.id) : path.boss) } : path;

    const standardFaces = () => [1,2,3,4,5,6].map(v => ({ id: 'standard', value: v, type: 'standard', label: String(v), style: '' }));
    const DICE_ART = Object.freeze({

            3: 'assets/dice/die-3.png',
            4: 'assets/dice/die-4.png',
            5: 'assets/dice/die-5.png',
            6: 'assets/dice/die-6.png',

    const getDiceSettleMs = (settings, reducedMotion) => {
        const scale = DICE_SPEED_SCALE[settings?.diceSpeed] || 1;
        const base = DICE_ROLL_SETTLE_MS * scale;
        return reducedMotion ? Math.max(120, base * 0.35) : base;

    const verdictGlowForFace = (faceId, type) => {

            WILD_FACE: 'rgba(255, 0, 127, 0.65)',
            BLOOD_6: 'rgba(255, 45, 45, 0.62)',
            ECHO_FACE: 'rgba(0, 221, 255, 0.6)',
            SHIV_FACE: 'rgba(255, 72, 38, 0.68)',
            WIREBAG_FACE: 'rgba(0, 221, 255, 0.55)',
            GHOST_FACE: 'rgba(234, 234, 255, 0.58)',
            MULT_FACE: 'rgba(0, 221, 255, 0.5)',
            GOLD_FACE: 'rgba(214, 184, 92, 0.56)'
        };
        if (byFace[faceId]) return byFace[faceId];
        if (type === 'blood') return 'rgba(255, 45, 45, 0.62)';
        if (type === 'danger') return 'rgba(255, 0, 127, 0.58)';
        return 'rgba(214, 184, 92, 0.52)';
    };
    const impactProfileForFace = (faceId, type) => {
        if (!faceId || faceId === 'standard') return null;
        const byFace = {
            BLOOD_6: { colors: ['#ff3131', '#ff6b3d'], count: 7 },
            SHIV_FACE: { colors: ['#ff5a3d', '#ffd166'], count: 7 },
            WILD_FACE: { colors: ['#ff007f', '#00ddff'], count: 8 },
            ECHO_FACE: { colors: ['#00ddff', '#9be7ff'], count: 6 },
            WIREBAG_FACE: { colors: ['#00ddff', '#67e8f9'], count: 6 },
            GHOST_FACE: { colors: ['#f5f3ff', '#dbeafe'], count: 5 },
            GOLD_FACE: { colors: ['#facc15', '#fde68a'], count: 5 },
            MULT_FACE: { colors: ['#00ddff', '#a5f3fc'], count: 5 }
        };
        if (byFace[faceId]) return byFace[faceId];
        if (type === 'blood') return { colors: ['#ff3131', '#ff6b3d'], count: 6 };
        if (type === 'danger') return { colors: ['#ff007f', '#ff6b3d'], count: 6 };
        return null;

    const CashRain = ({ count = 24, reducedMotion = false }) => {
        const cappedCount = Math.max(0, Math.min(count, reducedMotion ? 8 : 36));
        const bills = useMemo(() => Array.from({ length: cappedCount }, (_, i) => ({
            id: i,
            depth: reducedMotion ? 'mid' : (i % 3 === 0 ? 'near' : i % 3 === 1 ? 'mid' : 'far'),
            left: `${Math.random() * 100}%`,
            tx: `${(Math.random() - .5) * 620}px`,
            delay: reducedMotion ? '0s' : `${Math.random() * 0.55}s`,
            label: i % 3 === 0 ? '$100' : i % 3 === 1 ? '$50' : '$20'

        return (
            <div className="absolute inset-0 pointer-events-none z-[200]">

                    <div key={bill.id} className={`cash-bill ${bill.depth} absolute w-16 h-7`} style={{ left: bill.left, '--tx': bill.tx, animationDelay: bill.delay }}>
                        <div className="cash-bill-inner text-[#1a2408] font-bold text-xs flex items-center justify-center">{bill.label}</div>
                    </div>
                ))}
            </div>
        );
    };

    const Bone = ({ data, rolling, kept, selected, slot, onClick, onPill, onExplainPill, raidPill, reducedMotion, canPill = true, pillPulse = false, previewTint = null, colorblindHeld = false }) => {
        const rollStyleRef = useRef({
            '--roll-delay': `${Math.min(240, slot * 52 + Math.floor(Math.random() * 12))}ms`,
            '--roll-tilt': `${(Math.random() - 0.5) * 18}deg`,
            '--rest-tilt': `${(Math.random() - 0.5) * 10}deg`
        });
        const [verdictColor, setVerdictColor] = useState(null);
        const [impactParticles, setImpactParticles] = useState([]);
        const isCarved = !!(data.faceId && data.faceId !== 'standard');
        const showTumble = rolling && !reducedMotion;
        const faceSrc = rolling
            ? DICE_ART.faces.blank
            : (isCarved ? DICE_ART.faces.blank : diceStandardFaceSrc(data.value));
        useEffect(() => {
            if (rolling) return;
            const glow = verdictGlowForFace(data.faceId, data.type);
            const profile = impactProfileForFace(data.faceId, data.type);
            let glowId = null;
            let particleId = null;
            if (glow) {
                setVerdictColor(glow);
                glowId = setTimeout(() => setVerdictColor(null), 420);
            }
            if (profile && !reducedMotion) {
                const particles = Array.from({ length: profile.count }, (_, idx) => ({
                    id: `${data.id}-${idx}`,
                    color: profile.colors[idx % profile.colors.length],
                    px: `${(Math.random() - .5) * 44}px`,
                    py: `${(Math.random() - 1.05) * 38}px`,
                    left: `${42 + ((Math.random() - .5) * 22)}%`,
                    top: `${48 + ((Math.random() - .5) * 16)}%`
                }));
                setImpactParticles(particles);
                particleId = setTimeout(() => setImpactParticles([]), 360);
            } else {
                setImpactParticles([]);
            }
            return () => {
                if (glowId) clearTimeout(glowId);
                if (particleId) clearTimeout(particleId);
            };
        }, [rolling, data.faceId, data.type, data.id, reducedMotion]);
        return (
            <div className={`relative bone-slot-inner ${previewTint ? 'bone-preview-tint' : ''}`} style={previewTint ? { '--preview-tint': previewTint } : undefined}>

                        aria-label={`Bone slot ${slot + 1}`}
                    >
                        {verdictColor && !rolling && <div className="absolute inset-0 rounded-lg pointer-events-none bone-verdict-glow" style={{ '--verdict-color': verdictColor }} />}
                        {impactParticles.map((particle) => <span key={particle.id} className="impact-particle" style={{ color: particle.color, left: particle.left, top: particle.top, '--px': particle.px, '--py': particle.py }} />)}
                        <img className="bone-die-img" src={faceSrc} alt="" draggable={false} decoding="async" />
                        {!rolling && isCarved && (
                            <div className={`bone-carve-overlay border ${data.faceStyle}`}>
                                <div className="font-serif text-2xl md:text-3xl leading-none text-white drop-shadow">{data.faceLabel.charAt(0)}</div>
                                <div className="text-[8px] uppercase tracking-tighter text-center leading-none mt-1 hidden sm:block text-white/90">{data.faceLabel}</div>
                            </div>
                        )}
                    </button>
                </div>
                {!rolling && (
                    <button
                        type="button"
                        disabled={!canPill}

                        onMouseEnter={onExplainPill}
                        onFocus={onExplainPill}
                        title={canPill ? 'Pill reroll this bone' : 'No pills left'}
                        aria-label={canPill ? 'Reroll this bone (spend 1 pill)' : 'No pills remaining'}
                        className={`absolute -top-3 -right-3 z-50 flex min-h-11 min-w-11 md:min-h-8 md:min-w-9 items-center justify-center rounded-full border border-[#0df]/70 bg-black px-1.5 font-mono text-[9px] font-bold text-[#0df] shadow-[0_0_10px_rgba(0,221,255,.25)] transition-opacity ${canPill ? 'opacity-100 hover:bg-[#0a1520]' : 'cursor-not-allowed opacity-35'} ${pillPulse && canPill ? 'animate-pulse ring-2 ring-[#ff007f]/80' : ''}`}

        const faceSrc = (isModifier || showCarvedOverlay) ? DICE_ART.faces.blank : diceStandardFaceSrc(pipValue);

        return (
            <button

                className={`carving-die-tile w-20 h-20 md:w-32 md:h-32 rounded-lg border-2 border-[#8c8880] flex flex-col items-center justify-center shadow-2xl hover:scale-105 hover:ring-4 ring-[#0df] relative bg-black/20 ${className}`}
            >
                <img className="w-[88%] h-[88%] object-contain pointer-events-none" src={faceSrc} alt="" draggable={false} decoding="async" />
                {overlayItem && (
                    <div className={`absolute inset-[10%] rounded flex flex-col items-center justify-center border pointer-events-none ${overlayItem.faceStyle || overlayItem.style}`}>
                        <div className="font-serif text-3xl md:text-4xl leading-none text-white drop-shadow">{(overlayItem.faceLabel || overlayItem.label || '?').charAt(0)}</div>

            <div className="absolute right-2 top-1 bg-black/90 border border-cyan-400 text-xs font-mono p-2 z-50 w-40 rounded shadow-xl pointer-events-none">

                <div>MULT: x{result.mult.toFixed(2)}</div>

                {result.triggers.length > 0 && (
                    <div className="mt-1 border-t border-gray-600 pt-1">

                            <div key={i} className="text-[10px] text-cyan-300">

            </div>

    const CategoryUnlockFooter = ({ meta }) => {

        return (
            <div className="mt-2 pt-2 border-t border-dashed border-gray-500 text-[10px] font-mono text-left space-y-1">

                <p className="text-gray-600 leading-snug">

                            <span>{row.runsUntil > 0 ? ` — unlocks at ${row.unlockAtRun} runs (${row.runsUntil} to go)` : ` — unlocks at ${row.unlockAtRun} runs`}</span>

            title={runsUntil > 0 ? `Unlocks after ${unlockAtRun} completed runs (${runsUntil} to go)` : `Unlocks after ${unlockAtRun} completed runs`}
        >
            <span className="flex flex-col items-start text-gray-600">
                <span className="font-bold line-through decoration-gray-500/80">{cat.name}</span>
                <span className="text-[10px] font-mono text-gray-500 mt-0.5">
                    {runsUntil > 0 ? `Unlocks after ${unlockAtRun} runs · ${runsUntil} to go` : `Unlocks after ${unlockAtRun} runs`}
                </span>
            </span>
            <span className="text-[10px] font-mono font-bold text-gray-500 tracking-wide">LOCKED</span>

    const ScoreRow = ({ id, cat, result, used, canScore, onScore, handLevel = HAND_MASTERY_TUNING.baseLevel, ruleTooltip = '', onPreviewChange = null, payoutSquash = false }) => {
        const [hover, setHover] = useState(false);

        const showTriggers = canScore && result.valid && triggers.length > 0;

        return (

                onBlur={() => { setHover(false); setPreview(false); }}
                disabled={!canScore}
                title={titleParts.join(' — ')}
                aria-label={titleParts.length ? `${cat.name}. ${titleParts.join(' ')}` : cat.name}
                className={`score-row w-full flex justify-between items-center py-2 px-2 border-b border-dashed transition-colors text-xs md:text-base relative ${used ? 'opacity-55 border-gray-400' : canScore && result.valid ? `bg-black/10 hover:bg-black/20 border-transparent font-bold score-row-ready${chainHot ? ' score-row-chain-hot' : ''}${payoutSquash ? ' score-row-payout-squash' : ''}` : canScore ? 'text-red-700 hover:bg-red-100 border-gray-400 score-row-danger' : 'border-gray-400 opacity-70'}`}

    const BossIntro = ({ boss, target, onDone, reducedMotion }) => {
        const [typed, setTyped] = useState('');
        const [showDesc, setShowDesc] = useState(false);
        useEffect(() => {
            if (!boss) return;
            if (reducedMotion) {
                setTyped(boss.name);
                setShowDesc(true);
                const doneId = window.setTimeout(onDone, 900);
                return () => window.clearTimeout(doneId);
            }
            setTyped('');
            setShowDesc(false);
            const chars = boss.name.split('');
            let idx = 0;
            let revealId = null;
            const typer = window.setInterval(() => {
                idx += 1;
                setTyped(chars.slice(0, idx).join(''));
                if (idx >= chars.length) {
                    window.clearInterval(typer);
                    revealId = window.setTimeout(() => setShowDesc(true), 120);
                }
            }, 40);
            const id = window.setTimeout(onDone, 1600);
            return () => {
                window.clearTimeout(id);
                if (revealId) window.clearTimeout(revealId);
                window.clearInterval(typer);
            };
        }, [boss, reducedMotion]);
        if (!boss) return null;
        const microByBoss = {
            LOAN_SHARK: 'IOUs flutter onto the table.',
            JUNKIE: 'Neon sputters. Digits scramble.',
            CROOKED_COP: 'Red-blue wash sweeps the room.',
            INFORMANT: 'The stash line freezes over.',
            BOUNCER: 'Quota stamp slams into place.',
            THE_RAID: 'Sirens drown out the alley.'
        };
        return (
            <div className="absolute inset-0 z-[250] flex items-center justify-center overflow-hidden">
                <div className="boss-intro-backdrop" aria-hidden></div>
                <div className="absolute inset-0 bg-black/55 pointer-events-none z-[1]"></div>

        const [spot, setSpot] = useState(null);
        useEffect(() => {
            if (!step) return undefined;
            const sel = {
                'roll-btn': '[data-tutorial="roll-btn"]',
                'dice-lane': '[data-tutorial="dice-lane"]',
                'payout-sheet': '[data-tutorial="payout-sheet"]',
                'heat-quota': '[data-tutorial="heat-quota"]',
                'shop-panel': '[data-tutorial="shop-panel"]'
            }[step.focus];
            const measure = () => {
                const el = sel ? document.querySelector(sel) : null;
                if (!el) {
                    setSpot(null);
                    return;
                }
                const r = el.getBoundingClientRect();
                setSpot({ top: r.top, left: r.left, width: r.width, height: r.height });
            };
            measure();
            window.addEventListener('resize', measure);
            const id = window.setInterval(measure, reducedMotion ? 800 : 400);
            return () => {
                window.removeEventListener('resize', measure);
                window.clearInterval(id);
            };

    const StoryPanelOverlay = ({ beat, reducedMotion, onFinish }) => {
        const [exiting, setExiting] = useState(false);
        const [charIdx, setCharIdx] = useState(0);
        const [imageFailed, setImageFailed] = useState(false);
        const finishRef = useRef(onFinish);
        finishRef.current = onFinish;

        const finish = () => {
            if (exiting) return;
            setExiting(true);
            window.setTimeout(() => finishRef.current?.(), 280);
        };

        useEffect(() => {
            if (!beat) return undefined;
            setExiting(false);
            setCharIdx(0);
            setImageFailed(false);
            let cancelled = false;
            const caption = beat.caption || '';
            const holdMs = reducedMotion
                ? (GutterbonesStory?.getReducedMotionHold?.() || 1000)
                : (beat.holdMs || 1800);
            let typeInterval = null;
            if (!reducedMotion && caption.length) {
                typeInterval = window.setInterval(() => {
                    setCharIdx((n) => {
                        if (n >= caption.length) return n;
                        return n + 1;
                    });
                }, 30);
            } else {
                setCharIdx(caption.length);
            }
            const holdTimer = window.setTimeout(() => {
                if (!cancelled) finish();
            }, holdMs);
            return () => {
                cancelled = true;
                if (typeInterval) window.clearInterval(typeInterval);
                window.clearTimeout(holdTimer);
            };
        }, [beat?.src, reducedMotion]);

        useEffect(() => {
            if (imageFailed) finish();
        }, [imageFailed]);

                scoreBreakdownTimeoutRef.current = null;
            }
            if (scoreResolutionTimeoutRef.current != null) {
                clearScheduledTimeout(scoreResolutionTimeoutRef.current);
                scoreResolutionTimeoutRef.current = null;
            }
            setScoreBreakdown(null);
            setScoreResolution(null);
            setChainStepsRevealed(null);
            setSynergyLinks([]);
        };

        const scheduleTimeout = (fn, ms) => {
            const id = window.setTimeout(() => {
                timeoutIdsRef.current.delete(id);
                fn();
            }, ms);
            timeoutIdsRef.current.add(id);
            return id;
        };
        const scheduleInterval = (fn, ms) => {
            const id = window.setInterval(fn, ms);
            intervalIdsRef.current.add(id);
            return id;
        };
        const clearScheduledTimeout = (id) => {
            window.clearTimeout(id);
            timeoutIdsRef.current.delete(id);
        };
        const clearScheduledInterval = (id) => {
            window.clearInterval(id);
            intervalIdsRef.current.delete(id);
        };
        const showMechanicPopup = (hintKey) => {
            const hint = MECHANIC_HINTS[hintKey];
            if (!hint) return;
            const now = Date.now();
            const prev = lastMechanicPopupRef.current;
            if (prev.key === hintKey && (now - prev.at) < 1200) return;
            lastMechanicPopupRef.current = { key: hintKey, at: now };
            const id = Math.random();
            setMechanicPopup({ id, ...hint });
            scheduleTimeout(() => {
                setMechanicPopup(current => (current?.id === id ? null : current));
            }, 2800);
        };
        const triggerCameraKick = (kind = 'soft') => {
