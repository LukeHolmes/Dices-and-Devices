        ctx: null,
        volume: 1,
        noiseBuffer: null,
        ambientNodes: null,
        init() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx?.state === 'suspended') this.ctx.resume();
        },
        setVolume(nextVolume) {
            this.volume = nextVolume;
            if (!this.ambientNodes || !this.ctx) return;
            const now = this.ctx.currentTime;
            this.ambientNodes.humGain.gain.setTargetAtTime(0.02 * this.volume, now, 0.18);
            this.ambientNodes.noiseGain.gain.setTargetAtTime(0.012 * this.volume, now, 0.18);
        },
        ensureNoiseBuffer() {
            if (!this.ctx) return null;
            if (this.noiseBuffer) return this.noiseBuffer;
            const noise = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
            const data = noise.getChannelData(0);
            for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2) - 1;
            this.noiseBuffer = noise;
            return noise;
        },
        playNoiseBurst({ duration = 0.08, volume = 0.06, filterFreq = 900, when = 0, pan = 0 } = {}) {
            if (!this.ctx || this.volume <= 0) return;
            const buffer = this.ensureNoiseBuffer();
            if (!buffer) return;
            const source = this.ctx.createBufferSource();
            source.buffer = buffer;
            const lowpass = this.ctx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = filterFreq;
            const gain = this.ctx.createGain();
            const startAt = this.ctx.currentTime + when;
            gain.gain.setValueAtTime(0.0001, startAt);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume * this.volume), startAt + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
            if (this.ctx.createStereoPanner) {
                const panner = this.ctx.createStereoPanner();
                panner.pan.value = pan;
                source.connect(lowpass);
                lowpass.connect(gain);
                gain.connect(panner);
                panner.connect(this.ctx.destination);
            } else {
                source.connect(lowpass);
                lowpass.connect(gain);
                gain.connect(this.ctx.destination);
            }
            source.start(startAt);
            source.stop(startAt + duration + 0.03);
        },
        startAmbient() {
            if (!this.ctx || this.ambientNodes || this.volume <= 0) return;
            const hum = this.ctx.createOscillator();
            hum.type = 'sawtooth';
            hum.frequency.value = 42;
            const humGain = this.ctx.createGain();
            humGain.gain.value = 0.0001;
            hum.connect(humGain);
            humGain.connect(this.ctx.destination);

            const roomNoise = this.ctx.createBufferSource();
            roomNoise.buffer = this.ensureNoiseBuffer();
            roomNoise.loop = true;
            const noiseHigh = this.ctx.createBiquadFilter();
            noiseHigh.type = 'highpass';
            noiseHigh.frequency.value = 35;
            const noiseLow = this.ctx.createBiquadFilter();
            noiseLow.type = 'lowpass';
            noiseLow.frequency.value = 220;
            const noiseGain = this.ctx.createGain();
            noiseGain.gain.value = 0.0001;
            roomNoise.connect(noiseHigh);
            noiseHigh.connect(noiseLow);
            noiseLow.connect(noiseGain);
            noiseGain.connect(this.ctx.destination);

            hum.start();
            roomNoise.start();
            const now = this.ctx.currentTime;
            humGain.gain.linearRampToValueAtTime(0.02 * this.volume, now + 0.4);
            noiseGain.gain.linearRampToValueAtTime(0.012 * this.volume, now + 0.45);
            this.ambientNodes = { hum, humGain, roomNoise, noiseGain };
        },
        stopAmbient() {
            if (!this.ambientNodes || !this.ctx) return;
            const now = this.ctx.currentTime;
            const { hum, humGain, roomNoise, noiseGain } = this.ambientNodes;
            humGain.gain.cancelScheduledValues(now);
            noiseGain.gain.cancelScheduledValues(now);
            humGain.gain.setTargetAtTime(0.0001, now, 0.08);
            noiseGain.gain.setTargetAtTime(0.0001, now, 0.08);
            setTimeout(() => {
                try { hum.stop(); } catch (e) {}
                try { roomNoise.stop(); } catch (e) {}
                hum.disconnect();
                roomNoise.disconnect();
                humGain.disconnect();
                noiseGain.disconnect();
            }, 220);
            this.ambientNodes = null;
        },
        playTone(f, t, d, v = 0.1) {
            if (!this.ctx || this.volume <= 0) return;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.value = v * this.volume;
            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + d);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + d);
        },
