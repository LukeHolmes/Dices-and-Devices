[project]
name = "gutterbones-playtest-bridge"
version = "0.2.0"
description = "Outbound n8n-polling worker for Gutterbones diagnostics playtests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
http = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]

[project.scripts]
gb-bridge-worker = "gb_bridge.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]